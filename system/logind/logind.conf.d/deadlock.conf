[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff

# Let logind suspend on lid close natively — a custom Hyprland switch-device
# bind was tried first (keybinds.lua) but never actually fired in this fork's
# Lua bridge (confirmed live: no trace in hyprland.log across two lid
# close/open cycles + reboots). Explicit action on BOTH lines matters:
# HandleLidSwitchExternalPower was found live at "" (empty/invalid) while
# plugged in, which matches no known action — lid close silently did nothing
# on AC. Locking before sleep is the session's job: the notch shell holds a
# logind delay inhibitor and locks on PrepareForSleep, for ANY suspend
# regardless of trigger (a root sleep hook cannot: systemd freezes
# user.slice while those hooks run).
#
# suspend-then-hibernate (not plain suspend, 2026-08-25): this machine only
# has s2idle (no S3 deep sleep — confirmed via /sys/power/mem_sleep), which
# drains battery over long lid-closed periods. logind suspends immediately
# (fast resume) and auto-escalates to real hibernation after
# HibernateDelaySec (system/systemd/sleep.conf.d/deadlock.conf) if nothing
# wakes it — zero battery drain past that point. Requires resume= on the
# kernel cmdline + the mkinitcpio resume hook (bootstrap.sh step 25b).
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend-then-hibernate
