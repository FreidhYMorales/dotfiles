[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff

# Let logind suspend on lid close natively — a custom Hyprland switch-device
# bind was tried first (keybinds.lua) but never actually fired in this fork's
# Lua bridge (confirmed live: no trace in hyprland.log across two lid
# close/open cycles + reboots). Explicit "suspend" on BOTH lines matters:
# HandleLidSwitchExternalPower was found live at "" (empty/invalid) while
# plugged in, which matches no known action — lid close silently did nothing
# on AC. The lock-before-sleep step now happens via a systemd system-sleep
# hook instead (system/systemd/system-sleep/lock-before-sleep), which runs
# for ANY suspend regardless of trigger.
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
