[Sleep]
# How long after a suspend-then-hibernate suspend before systemd wakes the
# machine and hibernates it for real. Fixed here rather than exposed in the
# Quickshell >screensaver panel — that panel only writes to a user-owned
# JSON file, this needs root + a reboot (or a privileged helper) to take
# effect either way, so a rare-to-tweak system file is the simpler home.
HibernateDelaySec=30min
