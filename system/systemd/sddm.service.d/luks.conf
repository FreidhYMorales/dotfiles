# Installed by bootstrap.sh only when / sits on LUKS.
# KeyringMode=inherit: pam_systemd_loadkey in sddm-autologin reads the LUKS
# passphrase from root's kernel keyring, which SDDM only sees when it shares
# it (man pam_systemd_loadkey).
# plymouth quit --retain-splash: the splash keeps its last frame until
# Hyprland takes the display, so boot goes image -> desktop with no black gap.
# The leading "-" lets SDDM start even if Plymouth is not running.
[Service]
KeyringMode=inherit
ExecStartPre=-/usr/bin/plymouth quit --retain-splash
