# Keep NetworkManager out of the real Wi-Fi connection — iwd + impala own
# wlan0 for actual internet connectivity on this system. NetworkManager is
# only installed as a dependency of gnome-network-displays, which needs the
# running daemon for its Wi-Fi Direct (P2P) device enumeration during
# Miracast casting (see dotfiles/quickshell/.config/quickshell/recorder.md's
# sibling doc, backup/references/pending-features/gnome-network-displays.md).
# Without this, starting NetworkManager would fight iwd over the same
# interface and can drop the active connection.
[keyfile]
unmanaged-devices=interface-name:wlan0
