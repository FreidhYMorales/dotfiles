[Autologin]
Relogin=false
Session=
User=

[General]
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot
InputMethod=qtvirtualkeyboard
# QT_SCREEN_SCALE_FACTORS must match the scale in dotfiles/hypr/.config/hypr/monitors.conf
# (eDP-1 output) — SDDM's Xorg greeter starts before Hyprland, so it can't read that file
# itself; bump this by hand if the monitor scale ever changes.
GreeterEnvironment=QML2_IMPORT_PATH=/usr/share/sddm/themes/silent/components/,QT_IM_MODULE=qtvirtualkeyboard,QT_SCREEN_SCALE_FACTORS=eDP-1=2

[Theme]
Current=silent

[Users]
MaximumUid=60513
MinimumUid=1000
