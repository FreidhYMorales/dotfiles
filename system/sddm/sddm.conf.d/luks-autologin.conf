# Installed by bootstrap.sh only when / sits on LUKS: the disk passphrase is
# the authentication, so the session starts without a greeter, once per boot.
# Relogin=false: a logout shows the notch-lock greeter, which asks for the
# password. Sorts after deadlock.conf, so its [Autologin] wins.
# See docs/plans/dotfiles-audit/login-reinstall-plan.md.
[Autologin]
User=deadlock
Session=hyprland-uwsm.desktop
Relogin=false
