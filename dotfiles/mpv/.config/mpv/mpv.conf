# ── Hardware ──────────────────────────────────────────────────────────────
# Intel Arc iGPU (Lunar Lake, driver `xe`) — VA-API via intel-media-driver,
# rendered through libplacebo/Vulkan (ANV). auto-safe skips decoders known to
# be unstable instead of forcing hwdec and silently falling back to software.
hwdec=auto-safe
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk

# Demuxer cache — smooths seeking on both local files and streamed URLs
# (yt-dlp is already installed, so http/ytdl playback goes through this too).
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=75MiB

# ── Playback behavior ────────────────────────────────────────────────────
save-position-on-quit
keep-open=yes
screenshot-directory=~/Pictures/Screenshots
screenshot-format=png
screenshot-template=mpv-%F-%p

# ── Visual ────────────────────────────────────────────────────────────────
border=no
osd-bar=yes
osd-font="DepartureMono Nerd Font"
osd-font-size=32
osd-color="#FFFFFF"
osd-border-color="#000000"
