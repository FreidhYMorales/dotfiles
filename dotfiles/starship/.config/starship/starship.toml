"$schema" = 'https://starship.rs/config-schema.json'

# Colors are ANSI names only: kitty's palette is generated by matugen from the
# wallpaper, so the prompt re-themes with it. Do not use hex colors here.

add_newline = false
format = """\
  󰣇 \
  $directory\
  $git_branch$git_commit$git_state $git_status\
  $character\n
"""
# Only the toolchains installed on this machine (see bootstrap.sh).
right_format = """
$c\
$cpp\
$golang\
$java\
$lua\
$nodejs\
$deno\
$python\
$rust\
$cmd_duration\
$status\
$time"""

continuation_prompt = '▶▶ '

[directory]
format = "[$path](bold cyan)"
truncate_to_repo = false

[git_branch]
format = " [  $branch](bright-black)"

[git_status]
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
format = '[( $all_status$ahead_behind )](blue)'

[cmd_duration]
min_time = 2_000
format = " [ $duration](yellow)"

[status]
disabled = false
format = " [✘ $status](bold red)"

[time]
disabled = false
format = '[  $time ](bright-black)'
time_format = "%R"

[c]
format = " [$symbol(-$name)]($style)"
style = "bold bright-cyan"
symbol = "ℂ "

[cpp]
format = " [cpp](italic) [$symbol]($style)"
style = "bold bright-cyan"
symbol = " "

[golang]
format = " go [$symbol]($style)"
style = "bold bright-blue"
symbol = "∩ "

[java]
format = " java [$symbol]($style)"
style = "bold bright-red"
symbol = " "

[lua]
format = " [lua](italic) [$symbol]($style)"
style = "bold bright-yellow"
symbol = "⨀ "

[nodejs]
detect_extensions = []
detect_files = ["package-lock.json", "pnpm-lock.yaml", "yarn.lock"]
detect_folders = ["node_modules"]
format = " [ ](bold bright-green)"

[deno]
format = " [deno](italic) [ ](green bold)"

[python]
format = " [${symbol}(${virtualenv}) ${version}]($style)"
style = "bold bright-yellow"
symbol = "[ ](bold bright-blue)"
version_format = "${raw}"

[rust]
format = " [rs](italic) [$symbol]($style)"
style = "bold bright-red"
symbol = " "
