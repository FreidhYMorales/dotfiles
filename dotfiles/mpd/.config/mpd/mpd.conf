music_directory    "~/Music"
# Runtime data lives outside ~/.config (and outside the repo, which ~/.config/mpd
# is stowed from). The user unit drop-in creates these directories.
playlist_directory "~/.local/state/mpd/playlists"
db_file            "~/.local/state/mpd/database"
state_file         "~/.local/state/mpd/state"
sticker_file       "~/.local/state/mpd/sticker.sql"
# journald rotates it; read with: journalctl --user -u mpd
log_file           "syslog"

auto_update "yes"
bind_to_address "127.0.0.1"
restore_paused "yes"

audio_output {
        type            "pulse"
        name            "pulse audio"
}

# Buffer for the ncmpcpp visualizer
audio_output {
    type                    "fifo"
    name                    "my_fifo"
    path                    "/tmp/mpd.fifo"
    format                  "44100:16:2"
}
