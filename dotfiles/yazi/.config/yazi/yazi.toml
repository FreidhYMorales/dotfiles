# ============================================================
#  yazi.toml — Manager options, openers, previewer, tasks
#  Yazi 26.x — Terminal-native / Kitty-aware
# ============================================================

[mgr]
ratio          = [1, 3, 4]   # panel widths: parent / current / preview
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "none"      # swap to "size" or "mtime" if desired
show_hidden    = false
show_symlink   = true
scrolloff      = 5

[preview]
tab_size       = 2
max_width      = 1000
max_height     = 1000
cache_dir      = ""          # default (~/.cache/yazi)
# Kitty Graphics Protocol — native image rendering
image_filter   = "triangle"
image_quality  = 75
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
# %s/%d(N) are Yazi's own placeholders, substituted by Yazi itself before
# the command runs — NOT real shell positional args. The previous "$@"/"$1"
# syntax is unrecognized by this Yazi version and is left as literal dead
# text, so every one of these ran with an effectively empty target (nvim
# silently opened a blank buffer instead of erroring, which is why this
# went unnoticed until xdg-open's own "missing argument" usage dump surfaced
# it for images/PDFs).
edit = [
  { run = 'nvim %s', block = true, desc = "Neovim" },
]
# xdg-open only accepts a single target, so %s1 (first selected) instead of
# %s — with several files selected, %s made xdg-open print its usage error.
open = [
  { run = 'xdg-open %s1', desc = "xdg-open" },
]
# Local plugin (plugins/ouch-extract.yazi): runs ouch, prompts for a password
# (hidden input) when the archive is encrypted, and only moves the result into
# place on success. `ya emit` targets this Yazi instance via $YAZI_ID.
extract = [
  { run = 'ya emit plugin ouch-extract', desc = "Extract with ouch" },
]
reveal = [
  { run = 'xdg-open %d1', desc = "Reveal in file manager" },
]

# prepend_rules (not `rules`): `rules` replaced Yazi's whole default list,
# dropping the built-in folder/*, trash/**, vfs/* and inode/empty rules that
# newer Yazi releases rely on. Prepending keeps those as fallbacks.
[open]
prepend_rules = [
  # Archives → descomprimir con ouch
  { mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", use = ["extract"] },
  # Text & code → Neovim
  { mime = "text/*",                   use = ["edit", "open"] },
  { mime = "application/json",         use = ["edit", "open"] },
  { mime = "application/toml",         use = ["edit", "open"] },
  { mime = "application/x-shellscript", use = ["edit", "open"] },
  # Images → xdg-open
  { mime = "image/*",                  use = ["open"] },
  # Video/Audio → xdg-open
  { mime = "video/*",                  use = ["open"] },
  { mime = "audio/*",                  use = ["open"] },
  # PDF → xdg-open
  { mime = "application/pdf",          use = ["open"] },
  # Fallback for files only — `url = "*"` (no trailing slash) never matches
  # directories, unlike `mime = "*"`, so folders keep Yazi's folder/* rule.
  { url = "*",                         use = ["edit", "open"] },
]

[tasks]
bizarre_retry    = 5
image_alloc      = 134217728  # 128 MiB — suficiente para ~33 Mpx RGBA
image_bound      = [0, 0]
suppress_preload = false

# ============================================================
#  Plugin preloaders / previewers
#  Plugins de preview se añaden aquí (gvfs, rich-preview, glow, hexyl, mediainfo, ouch)
# ============================================================
[plugin]
# [git] — fetchers que calculan el estado git de archivos y carpetas
prepend_fetchers = [
  { url = "*",  run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]

prepend_preloaders = [
  # gvfs — evitar que Yazi intente precargar archivos en puntos de montaje GVFS
  # (MTP/SMB/SFTP: precargar ahí lee archivos remotos completos y traba la UI)
  { url = "/run/user/1000/gvfs/**/*",   run = "noop" },
  { url = "/run/media/deadlock/**/*",   run = "noop" },
  # simple-mtp — evitar precarga en montajes FUSE de simple-mtpfs
  { url = "/run/user/1000/mtp/**/*",    run = "noop" },
  # [mediainfo] — precargar audio, video e imagen
  { mime = "audio/*", run = "mediainfo" },
  { mime = "video/*", run = "mediainfo" },
  { mime = "image/*", run = "mediainfo" },
]

prepend_previewers = [
  # gvfs — noop en puntos de montaje para evitar errores de preview
  { url = "/run/user/1000/gvfs/**/*",   run = "noop" },
  { url = "/run/media/deadlock/**/*",   run = "noop" },
  # simple-mtp — noop en montajes FUSE de simple-mtpfs
  { url = "/run/user/1000/mtp/**/*",    run = "noop" },
  # [mediainfo] — audio, video e imagen con toggle thumbnail/metadata (keybind: I)
  { mime = "audio/*", run = "mediainfo" },
  { mime = "video/*", run = "mediainfo" },
  { mime = "image/*", run = "mediainfo" },
  # [glow via piper] — CLICOLOR_FORCE=1 necesario para ANSI en no-TTY
  { url = "*.md",    run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s dark "$1"' },
  # [rich-preview] — Otros formatos de texto estructurado
  { url = "*.csv",   run = "rich-preview" },
  { url = "*.rst",   run = "rich-preview" },
  { url = "*.ipynb", run = "rich-preview" },
  # *.json → built-in bat (instantáneo vs ~150ms Python startup de rich)
  # [ouch] — preview de contenido de archivos comprimidos
  { mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch" },
]

append_previewers = [
  # [hexyl via piper] — Hex dump como fallback final para binarios sin previewer
  { url = "*",       run = 'piper -- hexyl --border=none --terminal-width=$w --length 4096 "$1"' },
]
