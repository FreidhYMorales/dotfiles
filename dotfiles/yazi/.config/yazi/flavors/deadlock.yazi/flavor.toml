# ============================================================
#  flavor.toml — deadlock: terminal-native / transparent flavor
#  Schema: Yazi 26.x (theme sections: mgr, tabs, mode, indicator,
#          status, input, cmp, pick, notify, help, filetype, icon)
#  RULE: ANSI names ONLY — never hex codes.
#        Colors inherit from Kitty's active colorscheme (matugen).
#  ANSI palette reference:
#    black, red, green, yellow, blue, magenta, cyan, white
#    bright-black, bright-red, bright-green, bright-yellow,
#    bright-blue, bright-magenta, bright-cyan, bright-white
#    "reset" = terminal default fg/bg (transparent-aware)
#
#  NOTE: Yazi silently ignores unknown sections/keys here (an unknown
#  section is stored as a "custom" section, never reported). A renamed
#  key does NOT error — it just stops applying. When upgrading Yazi,
#  diff against the upstream preset theme-dark.toml.
# ============================================================

# ------------------------------------------------------------
#  Manager (file list)
# ------------------------------------------------------------
[mgr]
cwd = { fg = "cyan" }

# Find (n/N highlights)
find_keyword  = { fg = "yellow",  bold = true, underline = true }
find_position = { fg = "magenta", bg = "reset", bold = true }

# Symlink target shown after "->"
symlink_target = { fg = "bright-black", italic = true }

# Markers (left gutter)
marker_selected = { fg = "green",  bg = "green"  }
marker_copied   = { fg = "yellow", bg = "yellow" }
marker_cut      = { fg = "red",    bg = "red"    }
marker_marked   = { fg = "cyan",   bg = "cyan"   }

# Count badges
count_selected = { fg = "black", bg = "green"  }
count_copied   = { fg = "black", bg = "yellow" }
count_cut      = { fg = "black", bg = "red"    }

border_symbol = "│"
border_style  = { fg = "bright-black" }

# ------------------------------------------------------------
#  Tabs (native tab bar — yatline draws its own header, but
#  these still apply anywhere Yazi renders tabs natively)
# ------------------------------------------------------------
[tabs]
active   = { fg = "black", bg = "blue", bold = true }
inactive = { fg = "reset", bg = "reset" }

# ------------------------------------------------------------
#  Mode badges (status bar)
# ------------------------------------------------------------
[mode]
normal_main = { fg = "black", bg = "blue",    bold = true }
normal_alt  = { fg = "blue",  bg = "bright-black" }
select_main = { fg = "black", bg = "green",   bold = true }
select_alt  = { fg = "green", bg = "bright-black" }
unset_main  = { fg = "black", bg = "magenta", bold = true }
unset_alt   = { fg = "magenta", bg = "bright-black" }

# ------------------------------------------------------------
#  Indicator (hovered row) — replaces the old mgr.hovered /
#  mgr.preview_hovered keys
# ------------------------------------------------------------
[indicator]
parent  = { fg = "black", bg = "blue", bold = true }
current = { fg = "black", bg = "blue", bold = true }
preview = { fg = "black", bg = "bright-black" }
padding = { open = "█", close = "█" }

# ------------------------------------------------------------
#  Status bar
# ------------------------------------------------------------
[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep   = { fg = "bright-black" }
perm_type  = { fg = "green"  }
perm_read  = { fg = "yellow" }
perm_write = { fg = "red"    }
perm_exec  = { fg = "cyan"   }

progress_label  = { bold = true }
progress_normal = { fg = "blue", bg = "reset" }
progress_error  = { fg = "red",  bg = "reset" }

# ------------------------------------------------------------
#  Input (command prompt)
# ------------------------------------------------------------
[input]
border   = { fg = "blue" }
title    = { fg = "cyan", bold = true }
value    = { fg = "reset" }
selected = { fg = "black", bg = "blue" }

# ------------------------------------------------------------
#  Completion popup (was [completion])
# ------------------------------------------------------------
[cmp]
border   = { fg = "blue" }
active   = { fg = "black", bg = "blue", bold = true }
inactive = { fg = "reset", bg = "reset" }

# ------------------------------------------------------------
#  Pick dialog (open-with menu)
# ------------------------------------------------------------
[pick]
border   = { fg = "blue" }
active   = { fg = "black", bg = "blue", bold = true }
inactive = { fg = "reset" }

# ------------------------------------------------------------
#  Confirm / tasks / which / spot popups
# ------------------------------------------------------------
[confirm]
border  = { fg = "blue" }
title   = { fg = "blue", bold = true }
btn_yes = { fg = "black", bg = "blue", bold = true }
btn_no  = { fg = "reset" }

[tasks]
border  = { fg = "blue" }
hovered = { fg = "black", bg = "blue", bold = true }

[which]
border          = { fg = "blue" }
cand            = { fg = "cyan" }
rest            = { fg = "bright-black" }
desc            = { fg = "magenta" }
separator_style = { fg = "bright-black" }

[spot]
border   = { fg = "blue" }
title    = { fg = "blue" }
tbl_col  = { fg = "blue" }
tbl_cell = { fg = "black", bg = "blue" }

# ------------------------------------------------------------
#  Notify
# ------------------------------------------------------------
[notify]
title_info  = { fg = "green"  }
title_warn  = { fg = "yellow" }
title_error = { fg = "red"    }

icon_info  = ""
icon_warn  = ""
icon_error = ""

# ------------------------------------------------------------
#  Help overlay (old on/exec/desc/footer → chord/action/hovered)
# ------------------------------------------------------------
[help]
border  = { fg = "blue" }
chord   = { fg = "cyan" }
action  = { fg = "green" }
hovered = { fg = "black", bg = "blue", bold = true }

# ------------------------------------------------------------
#  Icons — ANSI palette, hereda colores del terminal
#  Prioridad: globs > dirs > files > exts > conds
#  prepend_globs sobreescribe los devicons hex del set built-in
# ------------------------------------------------------------
[icon]

# Globs: extensiones agrupadas por categoría — ANSI por categoría
# Coinciden con los colores de [filetype] más abajo
prepend_globs = [
  # Audio → cyan
  { url = "**/*.{mp3,flac,ogg,wav,opus,m4a,aac,wma,aiff,ape}",           text = "󰝚", fg = "cyan"          },
  # Video → bright-cyan
  { url = "**/*.{mp4,mkv,avi,mov,webm,flv,wmv,m4v,ts,vob,ogv}",          text = "󰕧", fg = "bright-cyan"    },
  # Imágenes → bright-magenta
  { url = "**/*.{jpg,jpeg,png,gif,webp,svg,bmp,ico,tiff,tif,heic,raw}",   text = "󰋩", fg = "bright-magenta" },
  # Archivos comprimidos → magenta
  { url = "**/*.{zip,tar,gz,bz2,xz,zst,7z,rar,cab,iso,tgz,tbz2,txz}",   text = "󰀼", fg = "magenta"        },
  # PDF → bright-red
  { url = "**/*.pdf",                                                      text = "󰈦", fg = "bright-red"     },
]

# Conds: tipo de archivo — se aplican a lo no capturado por globs/exts
prepend_conds = [
  { if = "dir",    text = "󰉋", fg = "blue"         },
  { if = "hidden", text = "󰈉", fg = "bright-black"  },
  { if = "orphan", text = "󰌺", fg = "red"           },
  { if = "link",   text = "󰌹", fg = "cyan"          },
  { if = "exec",   text = "󰆍", fg = "green"         },
]

# ------------------------------------------------------------
#  File-type color rules (ANSI only)
#  Yazi 26.x: style keys are flat on the rule (fg/bg/bold...),
#  not nested under `style = {}` — the nested form is ignored.
#  First match wins. `url = "*"` matches files only, `"*/"` dirs only.
#  Mime patterns use `**/` like the upstream preset, so they match
#  both plain ("image/png") and scheme-prefixed mime strings.
# ------------------------------------------------------------
[filetype]
rules = [
  # Special files (files and directories)
  { url = "*",  is = "orphan", fg = "red", underline = true },
  { url = "*",  is = "link",   fg = "cyan" },
  { url = "*/", is = "link",   fg = "cyan", bold = true },
  # Hidden
  { url = "*",  is = "hidden", fg = "bright-black" },
  { url = "*/", is = "hidden", fg = "bright-black", bold = true },
  # Executables
  { url = "*",  is = "exec",   fg = "green", bold = true },
  # Images
  { mime = "**/image/*", fg = "bright-magenta" },
  # Video
  { mime = "**/video/*", fg = "bright-cyan" },
  # Audio
  { mime = "**/audio/*", fg = "cyan" },
  # Archives
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "magenta" },
  # Documents
  { mime = "**/application/pdf", fg = "bright-red" },
  # Directories
  { url = "*/", fg = "blue", bold = true },
  # Fallback
  { url = "*",  fg = "reset" },
]
