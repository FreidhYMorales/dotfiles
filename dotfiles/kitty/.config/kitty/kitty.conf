# Colors come from matugen (regenerated on every wallpaper change and pushed
# live to running windows by the post-hook through the socket below).
include matugen-theme.conf

font_family DepartureMono Nerd Font
font_size 12.0
enable_audio_bell no
window_padding_width 5
cursor_trail 1
background_opacity 0.40
hide_window_decorations yes

allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
