# Add ~/.local/bin to PATH for the systemd --user session (and everything it
# spawns: Hyprland, UWSM-launched apps, hl.dsp.exec_cmd from Hyprland keybinds).
# Without this, scripts in ~/.local/bin (launch-or-focus, screenshot, ocr,
# reminder, clipboard...) resolve fine from an interactive zsh shell (PATH set
# in .zshrc/.zshenv) but are "command not found" when spawned directly by
# Hyprland/UWSM, which don't source shell rc files.
#
# Takes effect on next login — systemd-environment-d-generator only runs once
# at user-manager startup, so `hyprctl reload` alone won't pick this up.
PATH=$HOME/.local/bin:$PATH
